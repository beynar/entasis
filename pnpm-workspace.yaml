# Build scripts pnpm 11 may run on install. Without an explicit answer pnpm refuses the install
# (ERR_PNPM_IGNORED_BUILDS), which is what broke every CI run.
allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - '@tanstack/charts@0.3.1 || 0.6.4'
  - '@tanstack/highlight@0.1.0'
  - cn@0.3.0
  - svelte-streamdown@4.0.0
